[package]
name = "unxml"
# Placeholder only — the real version is injected from the git tag at release
# time (`cargo set-version` in release.yml). Never edit this by hand; releases
# are cut with `gh release create vX.Y.Z`, which creates the tag.
version = "0.0.0-dev"
edition = "2024"
description = "Pretty-print XML, HTML, and JSON in a light, YAML-like, readable format"
authors = ["Ville Vainio <vivainio@gmail.com>"]
license = "MIT"
repository = "https://github.com/vivainio/unxml-rs"
readme = "README.md"
keywords = ["xml", "html", "json", "pretty-print", "cli"]
categories = ["command-line-utilities", "parsing"]

[dependencies]
quick-xml = "0.36"
scraper = "0.20"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
glob = "0.3"
include_dir = "0.7"
serde_json = { version = "1.0", features = ["preserve_order"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy", "html", "parsing"] }

[dev-dependencies]
similar = "2.6"
